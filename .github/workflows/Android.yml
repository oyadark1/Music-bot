name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project if it was uploaded as a zip
        run: |
          if [ -f moon-play.zip ]; then unzip -q -o moon-play.zip -d unpacked; fi
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Find Android project
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "No settings.gradle.kts found."
            ls -R | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if ! gradle assembleDebug --no-daemon --console=plain > build.log 2>&1; then
            echo "===== ERRORS ====="
            grep -E "^e: |What went wrong|Could not|Execution failed" -A4 build.log | head -80
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MoonPlay-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
